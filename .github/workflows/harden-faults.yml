# The planted faults of the corpus rungs that need full LibreLane hardens
# (tests/test_corpus_faults.py's HARDEN_RUNGS), which bin/chip-flow test
# leaves out as too slow: upstream's checks.yml `harden-faults` matrix,
# carried here on its own (#196). One job per rung, so one rung's timeout
# or failure never hides another's, each running tests/check-harden-faults.sh
# with the same toolchain test.yml uses. A fast test
# (test_harden_faults_ci_matrix_runs_every_harden_rung) keeps the matrix
# equal to HARDEN_RUNGS. A gate that cannot run fails the job.
name: harden-faults

# Not on every PR: about an hour of hardens per rung. A PR or a push to main
# that touches what these rungs exercise runs it; workflow_dispatch runs it
# on any branch by hand.
on:
  pull_request:
    paths:
      - engine/**
      - corpus/**
      - tests/check-harden-faults.sh
      - tests/test_corpus_faults.py
      - .github/workflows/harden-faults.yml
      - .github/actions/toolchain/**
  push:
    branches: [main]
    paths:
      - engine/**
      - corpus/**
      - tests/check-harden-faults.sh
      - tests/test_corpus_faults.py
      - .github/workflows/harden-faults.yml
      - .github/actions/toolchain/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harden-faults-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-faults:
    name: harden-faults (${{ matrix.rung }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        rung: [counter8, dac_tile, sensor_counted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: tests/check-harden-faults.sh ${{ matrix.rung }}
        env:
          # under the job's own limit, so the script (not the runner) ends
          # a hang and names the fault it was on
          CHIP_FLOW_HARDEN_FAULTS_TIMEOUT: "6600"
        run: |
          set +e
          start=$SECONDS
          bash tests/check-harden-faults.sh "${{ matrix.rung }}" 2>&1 | tee "$RUNNER_TEMP/rung.log"
          rc=${PIPESTATUS[0]}
          echo "${{ matrix.rung }}: $((SECONDS - start))s, exit $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          grep '^check-harden-faults.sh:' "$RUNNER_TEMP/rung.log" >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc
