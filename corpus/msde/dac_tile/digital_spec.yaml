# digital_spec.yaml - the digital side's own declared copy of the crossing
# signals interface.yaml names (docs/design.md section 5: "two specs
# carrying the same entries"). Stands in for a real nested /vde block's own
# spec.yaml `interface:` section (engine/scripts/check_split.py's own
# docstring).
top: dac_tile_digital
interface:
  - name: bmsb
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {cap_ff: 14, note: "DAC MSB inverter input; a 3 um2 inverter, estimated from gate area"}
  - name: blsb
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {cap_ff: 14, note: "DAC LSB inverter input; a 3 um2 inverter, estimated from gate area"}
