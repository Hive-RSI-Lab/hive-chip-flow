top: dac_tile_analog
supply:
  vdd: 3.3
devices: [xmpm, xmnm, xmpl, xmnl, xrmsb, xr2lsb, xrlsb, xr2msb]
corners: default
# vout is high for bits low: each bit drives its ladder leg through a CMOS
# inverter (spec.md "What it does").
measures:
  - name: vout_00
    bounds: {min: 2.45, max: 3.25}
  - name: vout_01
    bounds: {min: 1.85, max: 2.52}
  - name: vout_10
    bounds: {min: 0.48, max: 0.72}
  - name: vout_11
    bounds: {max: 0.05}
# The crossing pins' timing limits for the macro_lib gate: both are inputs
# to the DAC's inverters (vout leaves on ua[0], not a crossing pin).
macro_timing:
  pins:
    bmsb: {max_transition_ns: 3.0}
    blsb: {max_transition_ns: 3.0}
  static: {bmsb: 0, blsb: 0}
  pad_caps_pf: {vout: 1.0}
  arcs: []
boundary:
  static: {bmsb: 0, blsb: 0, vout: open}
  d2a:
    bmsb: {observe: xdut.dm, ramp_ns: 1000}
    blsb: {observe: xdut.dl, ramp_ns: 1000}
