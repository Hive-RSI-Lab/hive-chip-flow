# analog_spec.yaml - the analog side's own declared copy of the crossing
# signals interface.yaml names (docs/design.md section 5: "two specs
# carrying the same entries"). Stands in for a real nested /ade block's own
# spec.yaml `interface:` section until M9 merges (engine/scripts/
# check_split.py's own docstring). No reference design exists yet for this
# rung (spec.md: "a spec with faults only") - this file is the analog
# side's declared interface, nothing more.
top: dac_spi_analog
interface:
  - name: code
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 8
    load: {cap_ff: 20, note: "R2R ladder DAC code input; placeholder estimate, no netlist yet"}
  - name: dac_en
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {cap_ff: 20, note: "DAC ladder power-down enable; placeholder estimate, no netlist yet"}
