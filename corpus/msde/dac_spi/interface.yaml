# interface.yaml - the splitter's own output (docs/design.md section 5):
# every crossing signal between dac_spi's digital and analog sides, with
# its direction, level, domain and width. `split` (engine/scripts/
# check_split.py) checks digital_spec.yaml and analog_spec.yaml each carry
# the same entries.
#
# direction is a2d (analog drives digital) or d2a (digital drives analog).
version: 1
signals:
  - name: code
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 8
    load: "R2R ladder DAC code input"
  - name: dac_en
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: "DAC ladder power-down enable"
