# digital_spec.yaml - the digital side's own declared copy of the crossing
# signals interface.yaml names (docs/design.md section 5: "two specs
# carrying the same entries"). Stands in for a real nested /vde block's own
# spec.yaml `interface:` section until M4 merges (engine/scripts/
# check_split.py's own docstring). No tile design exists yet for this
# rung; the cosim bench's SAR logic is tb/sar_adc_digital.v (spec.md).
top: sar_adc_digital
interface:
  - name: dac_code
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 8
    load: {cap_ff: 20, note: "internal DAC trial-voltage code; placeholder estimate, no netlist yet"}
  - name: sample
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {cap_ff: 50, note: "sample-and-hold close/track control; placeholder estimate, no netlist yet"}
  - name: cmp_out
    direction: a2d
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {pin: gf180mcu_fd_sc_mcu7t5v0__dffq_1/D, note: "SAR bit-decision input"}
  - name: comp_clk
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {cap_ff: 30, note: "comparator strobe clock; placeholder estimate, no netlist yet"}
