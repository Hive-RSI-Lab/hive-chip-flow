# interface.yaml - the splitter's own output (docs/design.md section 5):
# every crossing signal between sar_adc's digital and analog sides, with
# its direction, level, domain and width. `split` (engine/scripts/
# check_split.py) checks digital_spec.yaml and analog_spec.yaml each carry
# the same entries.
#
# direction is a2d (analog drives digital) or d2a (digital drives analog).
version: 1
signals:
  - name: dac_code
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 8
    load: "internal DAC trial-voltage code"
  - name: sample
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: "sample-and-hold close/track control"
  - name: cmp_out
    direction: a2d
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: "SAR bit-decision input"
  - name: comp_clk
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: "comparator strobe clock"
