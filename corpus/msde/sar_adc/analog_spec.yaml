# analog_spec.yaml - the analog side's own declared copy of the crossing
# signals interface.yaml names (docs/design.md section 5: "two specs
# carrying the same entries"). Stands in for a real nested /ade block's own
# spec.yaml `interface:` section until M9 merges (engine/scripts/
# check_split.py's own docstring). No reference design exists yet for this
# rung (spec.md: "a spec with faults only") - this file is the analog
# side's declared interface, nothing more.
top: sar_adc_analog
interface:
  - name: dac_code
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 8
    load: {cap_ff: 20, note: "internal DAC trial-voltage code; placeholder estimate, no netlist yet"}
  - name: sample
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {cap_ff: 50, note: "sample-and-hold close/track control; placeholder estimate, no netlist yet"}
  - name: cmp_out
    direction: a2d
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {pin: gf180mcu_fd_sc_mcu7t5v0__dffq_1/D, note: "SAR bit-decision input"}
  - name: comp_clk
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: {cap_ff: 30, note: "comparator strobe clock; placeholder estimate, no netlist yet"}
