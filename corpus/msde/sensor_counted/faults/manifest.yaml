# faults manifest (docs/design.md section 3, "### M10."): one entry per
# fault the `split` gate must catch (gates.yaml's msde.split row, plus the
# CLAUDE.md rule that every branch a builder adds gets a selfcheck case).
version: 1
faults:
  - name: split_width_mismatch
    gate: split
    plant: plant_width_mismatch.py
    expect: {status: fail, kind: width_mismatch}
  - name: split_direction_mismatch
    gate: split
    plant: plant_direction_mismatch.py
    expect: {status: fail, kind: direction_mismatch}
  - name: split_signal_missing_from_spec
    gate: split
    plant: plant_missing_signal.py
    expect: {status: fail, kind: signal_missing_from_spec}
  # M10's second half: the top gates on the assembled tile and the release.
  # top_drc/top_lvs plants harden the untouched top first (their gates read
  # its output on disk); see each plant_<gate>.py for why.
  - name: top_harden_macro_too_large
    gate: top_harden
    plant: plant_top_harden.py
    expect: {status: fail, kind: macro_too_large}
  # a macro driver at minimum width: the top's STA must report its slew (#177, #191)
  - name: top_harden_macro_driver_weak
    gate: top_harden
    plant: plant_top_harden_weak_driver.py
    expect: {status: fail, kind: max_slew_violation}
  # the same driver, the digital side reading osc_out through its own wire:
  # the net is don't-touch by the name synthesis gave it, not the pin's
  - name: top_harden_macro_net_renamed
    gate: top_harden
    plant: plant_top_harden_renamed_net.py
    expect: {status: fail, kind: max_slew_violation}
  # a macro clock output is proven by name through the netlist (#191): the
  # plant proves a real CTS tree on it, then buffers it by hand
  - name: top_harden_macro_clock_buffered
    gate: top_harden
    plant: plant_top_harden_macro_clock.py
    expect: {status: fail, kind: macro_clock_buffer_unproven}
  # the same clock with nothing on it: no net CTS can name
  - name: top_harden_macro_clock_unloaded
    gate: top_harden
    plant: plant_top_harden_macro_clock_unloaded.py
    expect: {status: fail, kind: macro_clock_net_unresolved}
  # the lib view is owed for every macro with a crossing pin (#177): a
  # netlist changed after macro_lib, or no macro_timing, runs no harden
  - name: top_harden_macro_lib_stale
    gate: top_harden
    plant: plant_top_harden_stale_lib.py
    expect: {status: fail, kind: macro_lib_stale}
  - name: top_harden_macro_lib_undeclared
    gate: top_harden
    plant: plant_top_harden_lib_undeclared.py
    expect: {status: fail, kind: macro_lib_missing}
  - name: top_drc_metal_spacing_violation
    gate: top_drc
    plant: plant_top_drc.py
    expect: {status: fail, kind: magic_drc_violation}
  - name: top_lvs_macro_pin_unconnected
    gate: top_lvs
    plant: plant_top_lvs.py
    expect: {status: fail, kind: netlist_mismatch}
  - name: top_erc_macro_input_floating
    gate: top_erc
    plant: plant_top_erc.py
    expect: {status: fail, kind: floating_gate}
  - name: release_stale_nested_release
    gate: release
    plant: plant_release.py
    expect: {status: fail, kind: nested_not_released}
  - name: boundary_output_stage_on_low_rail
    gate: boundary
    plant: plant_boundary_swing.py
    expect: {status: fail, kind: boundary_swing}
  - name: boundary_output_stage_too_weak
    gate: boundary
    plant: plant_boundary_transition.py
    expect: {status: fail, kind: boundary_transition}
  - name: boundary_section_missing
    gate: boundary
    plant: plant_boundary_undeclared.py
    expect: {status: fail, kind: boundary_undeclared}
  - name: boundary_observe_missing
    gate: boundary
    plant: plant_boundary_incomplete.py
    expect: {status: refused, error: "has no observe"}
  - name: split_nested_digital_width
    gate: split
    plant: plant_nested_width_mismatch.py
    expect: {status: fail, kind: nested_width_mismatch}
