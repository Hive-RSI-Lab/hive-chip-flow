# interface.yaml - the splitter's own output (docs/design.md section 5):
# every crossing signal between sensor_counted's digital and analog sides,
# with its direction, level, domain and width. `split` (engine/scripts/
# check_split.py) checks digital_spec.yaml and analog_spec.yaml each carry
# the same entries.
#
# direction is a2d (analog drives digital) or d2a (digital drives analog).
version: 1
signals:
  - name: osc_out
    direction: a2d
    level: cmos_3v3
    domain: clk_free
    width: 1
    load: "digital counter clock input"
  - name: osc_en
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 1
    load: "oscillator power-down enable"
