top: counter8
requirements:
  - id: REQ-WRAP
    text: count increments every clock and wraps from 255 to 0
    check: sim
  - id: REQ-RESET
    text: a held rst clears count to 0 on every following clock, including a
      one-clock reset asserted mid-run
    check: sim
  - id: REQ-FORMAL-RESET
    text: rst forces count to 0 on the very next clock, proven for all time
      rather than for whatever tb/ happens to try
    check: formal
    property: REQ_FORMAL_RESET
ports:
  clk: {dir: input, width: 1}
  rst: {dir: input, width: 1}
  count: {dir: output, width: 8}
clock:
  # 20ns (50MHz), not the 10ns the functional tb/ clocks at (tb/test_counter8.py
  # picks its own simulation period independently): this is what M4's harden
  # gate hands LibreLane as CLOCK_PERIOD, and 10ns left a -0.063ns setup
  # violation at the slow corner (max_ss_125C_3v00, GF180's mcu7t5v0 library) -
  # a generic-fallback-SDC artifact (no PNR_SDC_FILE is set), not a real path
  # this design is anywhere near, so widening the period is the honest fix
  # (vendored config.json's own comment: "Increase this in case you are
  # getting setup time violations"), not a relaxed pass criterion.
  period_ns: 20
  domains: [clk]
mutate:
  size: 24
  seed: 1
formal:
  depth: 20
# M4 (docs/design.md "### M4."): the Tiny Tapeout GF180 tile pin map -
# engine/lib/ttlib.py::generate_tt_wrapper reads this to build
# harden/tt_um_counter8.v. rst is active-high inside counter8 but TT's
# dedicated reset pin is active-low, hence the `~`.
tt_pins:
  clk: clk
  rst: ~rst_n
  count: uo_out[7:0]
