# faults manifest (docs/design.md section 3, "### M2."): one entry per gate
# this rung demonstrates. faults.py copies the rung into a scratch
# workspace, imports plant.py's `plant(ws)` and runs it, then runs `gate`
# and checks the result against `expect` - `status` is gate.py's own
# pass|fail vocabulary, `kind` is a kind from the failing findings list.
version: 1
faults:
  - name: spec_lint_requirement_no_check
    gate: spec_lint
    plant: plant_spec_lint.py
    expect: {status: fail, kind: requirement_no_check}
  - name: lint_latch
    gate: lint
    plant: plant_lint.py
    expect: {status: fail, kind: LATCH}
  - name: sim_wraps_one_early
    gate: sim
    plant: plant_sim.py
    expect: {status: fail, kind: test_failed}
  - name: holdout_delayed_reset
    gate: holdout
    plant: plant_holdout.py
    expect: {status: fail, kind: holdout_failed}
  - name: mutate_asserts_nothing
    gate: mutate
    plant: plant_mutate.py
    expect: {status: fail, kind: kill_rate_below_threshold}
  # --- M3 (docs/design.md "### M3.") --------------------------------------
  - name: formal_register_with_no_reset
    gate: formal
    plant: plant_formal.py
    expect: {status: fail, kind: property_failed}
  - name: cover_unreachable_state
    gate: cover
    plant: plant_cover.py
    expect: {status: fail, kind: line_coverage_below_threshold}
  # #80b: a requirement names an SV cover point the tests never hit
  - name: cover_requirement_not_hit
    gate: cover
    plant: plant_cover_requirement.py
    expect: {status: fail, kind: requirement_cover_not_hit}
  # #84: Icarus reads the unreset register's x as false and sim passes;
  # Verilator at random power-up values sticks the counter.
  - name: reset_indep_unreset_mode
    gate: reset_indep
    plant: plant_reset_indep.py
    expect: {status: fail, kind: reset_dependent}
  # #84 c: the same plant, proven: xprop's counterexample names `count`.
  - name: xprop_unreset_mode
    gate: xprop
    plant: plant_reset_indep.py
    expect: {status: fail, kind: output_x_after_reset}
  - name: synth_combinational_loop
    gate: synth
    plant: plant_synth.py
    expect: {status: fail, kind: combinational_loop}
  - name: release_rtl_changed_after_sim
    gate: release
    plant: plant_release.py
    expect: {status: fail, kind: gate_not_ready}
  # --- M4 (docs/design.md "### M4.") --------------------------------------
  # harden/timing/drc/lvs/glsim/precheck's own faults, all on this rung
  # (the fastest to harden of the three) - each plant() below runs
  # check_harden.run() itself (these gates read
  # harden's own output on disk, not anything faults.py records) before the
  # named gate is asked to evaluate it; see each plant_<gate>.py for why.
  - name: harden_design_too_large_for_tile
    gate: harden
    plant: plant_harden.py
    expect: {status: fail, kind: flow_step_failed}
  - name: timing_chain_misses_clock
    gate: timing
    plant: plant_timing.py
    expect: {status: fail, kind: setup_violation}
  # the PLL's miss (cf3aa2e): final/sdc froze one corner's constraints
  - name: timing_slow_corner_constraint
    gate: timing
    plant: plant_timing_corner_sdc.py
    expect: {status: fail, kind: setup_violation}
  # #73: a declared jitter budget the SDC's uncertainty does not cover
  - name: timing_jitter_above_uncertainty
    gate: timing
    plant: plant_timing_jitter.py
    expect: {status: fail, kind: clock_uncertainty_below_budget}
  # #195: a reset that releases off the pad with no synchroniser
  # (recovery: a removal miss would stop harden at its own hold checker)
  - name: timing_reset_release_unsynchronised
    gate: timing
    plant: plant_timing_recovery.py
    expect: {status: fail, kind: recovery_violation}
  - name: drc_metal_spacing_violation
    gate: drc
    plant: plant_drc.py
    expect: {status: fail, kind: magic_drc_violation}
  - name: lvs_extracted_net_split
    gate: lvs
    plant: plant_lvs.py
    expect: {status: fail, kind: netlist_mismatch}
  - name: glsim_functional_bug_through_gate_level
    gate: glsim
    plant: plant_glsim.py
    expect: {status: fail, kind: test_failed}
  - name: glsim_slow_clock_to_q_only_in_sdf
    gate: glsim
    plant: plant_glsim_sdf.py
    expect: {status: fail, kind: test_failed}
  - name: lec_stray_gate_glsim_cannot_see
    gate: lec
    plant: plant_lec.py
    expect: {status: fail, kind: lec_not_equivalent}
  - name: precheck_wrong_top_module_name
    gate: precheck
    plant: plant_precheck.py
    expect: {status: fail, kind: precheck_failed}
  - name: cdc_sample_with_no_synchroniser
    gate: cdc
    plant: plant_cdc.py
    expect: {status: fail, kind: cdc_unsynchronized}
  - name: rdc_reset_sync_second_flop_removed
    gate: cdc
    plant: plant_rdc.py
    expect: {status: fail, kind: rdc_unsynced_release}
  # --- #96: the optional FPGA prototype step -------------------------------
  # the clean run is the known answer: counter8 places on the up5k with an
  # Fmax above its spec clock
  - name: fpga_combinational_loop
    gate: fpga
    plant: plant_fpga.py
    expect: {status: fail, kind: fpga_comb_loop}
  - name: fpga_spec_clock_beats_fmax
    gate: fpga
    plant: plant_fpga_fmax.py
    expect: {status: fail, kind: fpga_fmax_below_clock}
