top: rv_core
requirements:
  - id: REQ-LOAD
    text: while idle (after rst, before run), each clock with we high writes
      din into the next memory byte, starting at byte 0 after rst and
      counting up; run high starts execution at byte address 0
    check: sim
  - id: REQ-READBACK
    text: while halted, dout shows byte din[1:0] of memory word din[6:2]
      when din[7] is 1, or byte din[1:0] of register din[5:2] when din[7]
      is 0; while not halted dout is 0
    check: sim
  - id: REQ-ALU
    text: ADD SUB SLL SLT SLTU XOR SRL SRA OR AND and ADDI SLTI SLTIU XORI
      ORI ANDI SLLI SRLI SRAI compute as RV32I defines them, with SRA and
      SRAI shifting in copies of the sign bit
    check: sim
  - id: REQ-UPPER
    text: LUI writes imm<<12; AUIPC writes imm<<12 plus the byte address of
      the AUIPC itself
    check: sim
  - id: REQ-BRANCH
    text: BEQ BNE BLT BGE BLTU BGEU jump to their own address plus the
      offset when the RV32I condition holds, and fall through otherwise
    check: sim
  - id: REQ-JUMP
    text: JAL and JALR write the address of the following instruction to
      rd and jump (JALR to (rs1+imm) with bit 0 cleared); a target's low two
      bits are dropped and the program counter wraps at 128 bytes
    check: sim
  - id: REQ-MEM
    text: LB LH LW LBU LHU and SB SH SW access the 128-byte little-endian
      memory at (rs1+imm) modulo 128, halfword accesses ignoring address
      bit 0 and word accesses bits 1:0, loads sign- or zero-extending as
      RV32I defines
    check: sim
  - id: REQ-X0
    text: x0 reads as 0 and a write to it is discarded
    check: sim
  - id: REQ-HALT
    text: ECALL and EBREAK halt the core with illegal low; once halted it
      stays halted, ignoring run and we, until rst
    check: sim
  - id: REQ-ILLEGAL
    text: any other encoding, including a register field of 16 or more,
      halts the core with illegal high before the instruction changes any
      register or memory; rst clears illegal
    check: sim
  - id: REQ-FORMAL-RESET
    text: rst forces halted and illegal low and dout to 0 on the very next
      clock, proven for all time rather than for whatever tb/ happens to try
    check: formal
    property: REQ_FORMAL_RESET
  - id: REQ-FORMAL-X0
    text: while halted, reading register 0 through the debug port gives 0,
      proven for every reachable state
    check: formal
    property: REQ_FORMAL_X0
ports:
  clk: {dir: input, width: 1}
  rst: {dir: input, width: 1}
  we: {dir: input, width: 1}
  run: {dir: input, width: 1}
  din: {dir: input, width: 8}
  dout: {dir: output, width: 8}
  halted: {dir: output, width: 1}
  illegal: {dir: output, width: 1}
clock:
  # 40ns (25MHz): a conservative CLOCK_PERIOD for the ALU-plus-memory-mux
  # path of a flop-based 128-byte memory, wider than uart/spi_fifo's. This
  # rung has not been through harden or timing yet (its faults manifest
  # does not name them), so the number is a starting point, not a result.
  period_ns: 40
  domains: [clk]
mutate:
  size: 24
  seed: 4
formal:
  depth: 8
# M4 (docs/design.md "### M4."): the Tiny Tapeout GF180 tile pin map. din
# fills ui_in and dout fills uo_out; we/run borrow two uio_in bits as plain
# inputs, halted/illegal ride on uio_out (their uio_oe bits driven high by
# engine/lib/ttlib.py::generate_tt_wrapper). rst is active-high inside
# rv_core, hence the `~`. The pins fit a tile; the logic (about 1500 flops
# of register file and memory) is larger than one GF180 tile holds, which is
# part of why this rung may stay red on the ladder.
tt_pins:
  clk: clk
  rst: ~rst_n
  din: ui_in[7:0]
  we: uio_in[0]
  run: uio_in[1]
  dout: uo_out[7:0]
  halted: uio_out[2]
  illegal: uio_out[3]
