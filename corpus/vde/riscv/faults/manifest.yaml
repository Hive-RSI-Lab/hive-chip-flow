# faults manifest (docs/design.md section 3, "### M2."; the RISC-V rung
# itself is "### M6."): one entry per gate this rung demonstrates. See
# corpus/vde/counter8/faults/manifest.yaml for the format.
version: 1
faults:
  - name: spec_lint_requirement_no_check
    gate: spec_lint
    plant: plant_spec_lint.py
    expect: {status: fail, kind: requirement_no_check}
  - name: lint_latch
    gate: lint
    plant: plant_lint.py
    expect: {status: fail, kind: LATCH}
  - name: sim_branch_lands_one_late
    gate: sim
    plant: plant_sim.py
    expect: {status: fail, kind: test_failed}
  - name: holdout_sra_zero_fills
    gate: holdout
    plant: plant_holdout.py
    expect: {status: fail, kind: holdout_failed}
  # On this core sby's abc pdr task finds the counterexample, then
  # yosys-witness's aiw2yw crashes converting it to a trace, so the task
  # reaches DONE (ERROR). check_formal.py's pdr_done_status reads that
  # case as pdr's FAIL, and smtbmc's basecase reports property_failed.
  - name: formal_register_with_no_reset
    gate: formal
    plant: plant_formal.py
    expect: {status: fail, kind: property_failed}
  - name: cover_unreachable_state
    gate: cover
    plant: plant_cover.py
    expect: {status: fail, kind: line_coverage_below_threshold}
  - name: synth_combinational_loop
    gate: synth
    plant: plant_synth.py
    expect: {status: fail, kind: combinational_loop}
