top: spi_fifo
requirements:
  - id: REQ-RX
    text: an 8-bit SPI frame (mosi, MSB-first, sampled on sclk rising edges
      while cs_n is low) is pushed onto the FIFO when the 8th bit
      completes
    check: sim
  - id: REQ-POP
    text: rd_en held for one clk edge pops the oldest queued byte onto
      rd_data on the following edge, when the FIFO is not empty
    check: sim
  - id: REQ-EMPTY
    text: empty is asserted iff the FIFO holds no bytes
    check: sim
  - id: REQ-FULL
    text: full is asserted iff the FIFO holds 4 bytes, and a completed SPI
      byte received while full is dropped without corrupting the existing
      contents
    check: sim
  - id: REQ-RESET
    text: rst clears the FIFO, the shift register and the in-progress bit
      count
    check: sim
ports:
  clk: {dir: input, width: 1}
  rst: {dir: input, width: 1}
  sclk: {dir: input, width: 1}
  mosi: {dir: input, width: 1}
  cs_n: {dir: input, width: 1}
  rd_en: {dir: input, width: 1}
  rd_data: {dir: output, width: 8}
  empty: {dir: output, width: 1}
  full: {dir: output, width: 1}
clock:
  # 25ns (40MHz) physical-implementation CLOCK_PERIOD, same reasoning as
  # counter8/uart's spec.yaml (20ns left a -0.02ns setup violation at
  # max_ss_125C_3v00, the FIFO's mem[] array adding a little more depth
  # than counter8's plain adder) - tb/test_spi_fifo.py picks its own
  # simulation period independently. sclk (the SPI bus clock) is driven far
  # slower than this in both tb/ and the reference model, by construction -
  # it is sampled in the clk domain, not a second clock: no CDC exception
  # is needed for physical implementation.
  period_ns: 25
  domains: [clk]
mutate:
  size: 24
  seed: 3
# M4 (docs/design.md "### M4."): the Tiny Tapeout GF180 tile pin map.
# empty/full ride on uio_out (with the matching uio_oe bits driven high by
# engine/lib/ttlib.py::generate_tt_wrapper) since uo_out is already full
# with rd_data. rst is active-high inside spi_fifo, hence the `~`.
tt_pins:
  clk: clk
  rst: ~rst_n
  sclk: ui_in[0]
  mosi: ui_in[1]
  cs_n: ui_in[2]
  rd_en: ui_in[3]
  rd_data: uo_out[7:0]
  empty: uio_out[0]
  full: uio_out[1]
