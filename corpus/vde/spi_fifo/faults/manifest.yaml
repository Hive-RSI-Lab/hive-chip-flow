# faults manifest (docs/design.md section 3, "### M2."): one entry per gate
# this rung demonstrates. See corpus/vde/counter8/faults/manifest.yaml for
# the mechanism. spi_fifo's own M4 (harden/timing/drc/lvs/glsim/precheck)
# faults live on counter8's manifest instead (the fastest rung to harden);
# this rung is exercised for real by those gates via tests/smoke-harden.sh
# and the M4 builder's own manual runs, not repeated here.
version: 1
faults:
  - name: spec_lint_requirement_no_check
    gate: spec_lint
    plant: plant_spec_lint.py
    expect: {status: fail, kind: requirement_no_check}
  - name: lint_latch
    gate: lint
    plant: plant_lint.py
    expect: {status: fail, kind: LATCH}
  - name: sim_full_empty_inverted
    gate: sim
    plant: plant_sim.py
    expect: {status: fail, kind: test_failed}
