top: uart_tx
requirements:
  - id: REQ-FRAME
    text: a frame is start(0), 8 data bits LSB-first, an even-parity bit
      (XOR of the 8 data bits) and stop(1), each held CLKS_PER_BIT clocks
    check: sim
  - id: REQ-BUSY
    text: busy is asserted from the start pulse until the stop bit's hold
      completes, then returns low
    check: sim
  - id: REQ-FORMAL-RESET
    text: rst forces tx to 1 and busy to 0 on the very next clock, proven
      for all time rather than for whatever tb/ happens to try
    check: formal
    property: REQ_FORMAL_RESET
ports:
  clk: {dir: input, width: 1}
  rst: {dir: input, width: 1}
  start: {dir: input, width: 1}
  data: {dir: input, width: 8}
  tx: {dir: output, width: 1}
  busy: {dir: output, width: 1}
clock:
  # 20ns (50MHz) for the same reason as counter8's spec.yaml: physical
  # implementation's CLOCK_PERIOD, independent of tb/test_uart_tx.py's own
  # simulation clock, widened for setup margin at the slow corner.
  period_ns: 20
  domains: [clk]
mutate:
  size: 24
  seed: 2
formal:
  depth: 20
# M4 (docs/design.md "### M4."): the Tiny Tapeout GF180 tile pin map. `data`
# (8 bits) already fills ui_in; `start` borrows one uio_in bit as a plain
# extra input (uio_oe stays 0 - always an input, never truly bidirectional
# here). rst is active-high inside uart_tx, hence the `~`.
tt_pins:
  clk: clk
  rst: ~rst_n
  start: uio_in[0]
  data: ui_in[7:0]
  tx: uo_out[0]
  busy: uo_out[1]
