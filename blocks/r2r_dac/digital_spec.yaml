# digital_spec.yaml - the digital side's own declared copy of the crossing
# signals interface.yaml names. Stands in for the nested /vde block's own
# spec.yaml `interface:` section (engine/scripts/check_split.py docstring).
top: r2r_dac_digital
interface:
  - name: dac_code
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 8
    load: {pin: gf180mcu_fd_sc_mcu7t5v0__buf_20/I, count: 1, note: "each bit is the input of one ladder switch driver, xd0..xd7 in the macro"}
