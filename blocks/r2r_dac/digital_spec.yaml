# digital_spec.yaml - the digital side's own declared copy of the crossing
# signals interface.yaml names. Stands in for the nested /vde block's own
# spec.yaml `interface:` section (engine/scripts/check_split.py docstring).
top: r2r_dac_digital
interface:
  - name: dac_code
    direction: d2a
    level: cmos_3v3
    domain: clk_sys
    width: 8
    load: "gate inputs of the 8 ladder switch driver cells inside the analog macro, one gf180mcu_fd_sc_mcu7t5v0 buffer input per bit"
